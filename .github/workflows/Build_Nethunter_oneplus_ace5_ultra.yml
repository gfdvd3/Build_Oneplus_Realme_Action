name: (Bazel/Kleaf) 一加 Ace5 Ultra (MT6991) NetHunter内核构建

env:
  TZ: Asia/Shanghai
  KERNEL_REPO: gfdvd3/android_kernel_oneplus_mt6991
  KERNEL_BRANCH: '16'
  MODULES_REPO: gfdvd3/android_kernel_modules_and_devicetree_oneplus_mt6991
  MODULES_BRANCH: '16'
  CCACHE_DIR: /tmp/ccache
  CCACHE_MAXSIZE: 5G
  SCHED_FILE: oneplus_ace5_ultra_b

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KSU分支(默认ReSukiSU)'
        required: true
        type: choice
        default: 'resukisu'
        options: ['resukisu', 'sukisu', 'ksunext', 'ksu', 'none']
      susfs_enable:
        description: '启用SUSFS'
        required: true
        type: boolean
        default: true
      kpm_enable:
        description: 'KPM模式'
        required: true
        type: choice
        default: 'false'
        options: ['false', 'builtin', 'kpn']
      lz4_enable:
        description: 'LZ4 1.10.0+ZSTD 1.5.7补丁'
        required: true
        type: boolean
        default: true
      lz4kd_enable:
        description: 'LZ4KD补丁'
        required: true
        type: boolean
        default: false
      bbr_enable:
        description: 'BBR拥塞控制'
        required: true
        type: choice
        default: 'false'
        options: ['false', 'true', 'default']
      better_net:
        description: '网络功能增强'
        required: true
        type: boolean
        default: false
      adios_enable:
        description: 'ADIOS IO调度器'
        required: true
        type: boolean
        default: true
      rekernel_enable:
        description: 'Re-Kernel支持'
        required: true
        type: boolean
        default: false
      baseband_guard:
        description: '内核级基带保护'
        required: true
        type: boolean
        default: true
      enable_scx:
        description: '完美风驰调度'
        required: true
        type: boolean
        default: true
      ccache_update:
        description: '更新ccache缓存'
        required: true
        type: boolean
        default: false
      kernel_suffix:
        description: '内核后缀'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python-is-python3 libssl-dev libelf-dev rsync cpio ccache

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel_source
          fetch-depth: 1

      - name: Checkout vendor modules/devicetree
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MODULES_REPO }}
          ref: ${{ env.MODULES_BRANCH }}
          path: kernel_source/kernel
          fetch-depth: 1

      - name: Checkout Kleaf build system
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/build kernel_source/build/kernel

      - name: Setup Bazel and workspace
        run: |
          cd kernel_source
          ln -sf build/kernel/kleaf/workspace.bazel WORKSPACE.bazel
          echo 'startup --output_user_root=/tmp/bazel_output_root' >> .bazelrc

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Remove ABI protections and dirty suffix
        run: |
          cd kernel_source
          rm -f android/abi_gki_protected_exports_*
          for f in scripts/setlocalversion; do
            [ -f "$f" ] || continue
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: Configure ccache
        run: |
          mkdir -p ${{ env.CCACHE_DIR }}
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -o compression=true
          ccache -s

      - name: Load ccache from cache
        uses: actions/cache@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ace5u-${{ github.event.inputs.ksu_type }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-ace5u-${{ github.event.inputs.ksu_type }}-${{ runner.os }}-
            ccache-ace5u-

      - name: Apply KernelSU
        id: ksu_version
        run: |
          cd kernel_source
          case "${{ github.event.inputs.ksu_type }}" in
            sukisu)
              curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU-Ultra/refs/heads/main/kernel/setup.sh" | bash -s builtin
              cd KernelSU
              KSU_VERSION=$(expr $(git rev-list --count main) + 37185 2>/dev/null || echo 114514)
              GIT_HASH=$(git rev-parse --short=8 HEAD)
              echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
              echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
              KSU_API_VER=$(curl -s "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/Makefile" | grep -m1 "KSU_VERSION_API :=" | awk -F'= ' '{print $2}' | tr -d '[:space:]')
              [ -z "$KSU_API_VER" ] && KSU_API_VER="3.1.7"
                VDEF=$'define get_ksu_version_full\nv\\$1-'"$GIT_HASH"$'@cctv18\nendef\n\nKSU_VERSION_API := '"$KSU_API_VER"$'\nKSU_VERSION_FULL := v'"$KSU_API_VER"$'-'"$GIT_HASH"$'@cctv18'
              awk -v d="$VDEF" '/REPO_OWNER :=/{print; print d; next}1' kernel/Makefile > kernel/Makefile.tmp && mv kernel/Makefile.tmp kernel/Makefile
              ;;
            resukisu)
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main
              echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@cctv18"' >> arch/arm64/configs/gki_defconfig
              cd KernelSU
              KSU_VERSION=$(expr $(git rev-list --count main) + 30700 2>/dev/null || echo 114514)
              echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
              echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
              ;;
            ksunext)
              curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
              cd KernelSU-Next
              KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
              echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
              echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
              sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := $KSU_VERSION/g" kernel/Kbuild
              KSU_TAG=$(curl -sL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | grep -o '"name": *"[^"]*"' | head -1 | sed 's/"name": "//;s/"//')
              sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_TAG/g" kernel/Kbuild
              ;;
            ksu)
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
              cd KernelSU
              KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/tiann/KernelSU/commits?sha=main&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000)
              echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
              echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
              sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
              ;;
            none)
              echo "KSUVER=0" >> $GITHUB_ENV
              echo "ksuver=0" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Apply SUSFS patches
        if: inputs.susfs_enable && inputs.ksu_type != 'none'
        run: |
          cd kernel_source
          git clone --depth=1 https://github.com/cctv18/susfs4oki.git susfs4ksu -b oki-android15-6.6
          wget https://github.com/${{ github.repository }}/raw/refs/heads/${{ github.ref_name }}/other_patch/69_hide_stuff.patch -O 69_hide_stuff.patch
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch ./
          cp susfs4ksu/kernel_patches/fs/* fs/
          cp susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 < 50_add_susfs_in_gki-android15-6.6.patch || true
          patch -p1 -N -F 3 < 69_hide_stuff.patch || true
          if [ "${{ github.event.inputs.ksu_type }}" = "ksu" ]; then
            cp susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
            cd KernelSU && patch -p1 < 10_enable_susfs_for_ksu.patch || true && cd ..
          fi

      - name: Apply LZ4 and ZSTD patches
        if: inputs.lz4_enable
        run: |
          cd kernel_source
          git clone --depth=1 https://github.com/${{ github.repository }}.git -b ${{ github.ref_name }} oppo_patches
          cp oppo_patches/zram_patch/001-lz4.patch ./
          cp oppo_patches/zram_patch/001-lz4-clearMake.patch ./
          cp oppo_patches/zram_patch/lz4armv8.S lib/
          cp oppo_patches/zram_patch/002-zstd.patch ./
          git apply -p1 < 001-lz4.patch || true
          git apply -p1 < 001-lz4-clearMake.patch || true
          patch -p1 < 002-zstd.patch || true
          rm -rf oppo_patches

      - name: Apply LZ4KD patches
        if: inputs.lz4kd_enable
        run: |
          cd kernel_source
          git clone --depth=1 https://github.com/ShirkNeko/SukiSU_patch.git
          cp -r SukiSU_patch/other/zram/lz4k/include/linux/* include/linux/
          cp -r SukiSU_patch/other/zram/lz4k/lib/* lib/
          cp -r SukiSU_patch/other/zram/lz4k/crypto/* crypto/
          cp SukiSU_patch/other/zram/zram_patch/6.6/lz4kd.patch ./
          patch -p1 -F 3 < lz4kd.patch || true

      - name: Add KSU and SUSFS configs
        run: |
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          if [ "${{ github.event.inputs.susfs_enable }}" = "true" ] && [ "${{ github.event.inputs.ksu_type }}" != "none" ]; then
            for opt in \
              CONFIG_KSU_SUSFS=y \
              CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y \
              CONFIG_KSU_SUSFS_SUS_PATH=y \
              CONFIG_KSU_SUSFS_SUS_MOUNT=y \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y \
              CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y \
              CONFIG_KSU_SUSFS_SUS_KSTAT=y \
              CONFIG_KSU_SUSFS_TRY_UMOUNT=y \
              CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y \
              CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
              CONFIG_KSU_SUSFS_ENABLE_LOG=y \
              CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y \
              CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
              CONFIG_KSU_SUSFS_OPEN_REDIRECT=y \
              CONFIG_KSU_SUSFS_SUS_MAP=y; do
              echo "$opt" >> arch/arm64/configs/gki_defconfig
            done
          fi
          if [ "${{ github.event.inputs.kpm_enable }}" = "builtin" ] && [[ "${{ github.event.inputs.ksu_type }}" =~ ^(sukisu|resukisu)$ ]]; then
            echo "CONFIG_KPM=y" >> arch/arm64/configs/gki_defconfig
          fi
          echo "CONFIG_TMPFS_XATTR=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> arch/arm64/configs/gki_defconfig
          if [ "${{ github.event.inputs.lz4kd_enable }}" = "true" ]; then
            for opt in CONFIG_ZSMALLOC=y CONFIG_CRYPTO_LZ4HC=y CONFIG_CRYPTO_LZ4K=y CONFIG_CRYPTO_LZ4KD=y CONFIG_CRYPTO_842=y; do
              echo "$opt" >> arch/arm64/configs/gki_defconfig
            done
          fi
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> arch/arm64/configs/gki_defconfig
          sed -i 's/check_defconfig//' build.config.gki
          echo "CONFIG_HEADERS_INSTALL=n" >> arch/arm64/configs/gki_defconfig

      - name: Add NetHunter/network configs
        if: inputs.better_net
        run: |
          cd kernel_source
          for opt in \
            CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y \
            CONFIG_NETFILTER_XT_SET=y \
            CONFIG_IP_SET=y CONFIG_IP_SET_MAX=65534 \
            CONFIG_IP_SET_BITMAP_IP=y CONFIG_IP_SET_BITMAP_IPMAC=y \
            CONFIG_IP_SET_BITMAP_PORT=y CONFIG_IP_SET_HASH_IP=y \
            CONFIG_IP_SET_HASH_IPMARK=y CONFIG_IP_SET_HASH_IPPORT=y \
            CONFIG_IP_SET_HASH_IPPORTIP=y CONFIG_IP_SET_HASH_IPPORTNET=y \
            CONFIG_IP_SET_HASH_IPMAC=y CONFIG_IP_SET_HASH_MAC=y \
            CONFIG_IP_SET_HASH_NETPORTNET=y CONFIG_IP_SET_HASH_NET=y \
            CONFIG_IP_SET_HASH_NETNET=y CONFIG_IP_SET_HASH_NETPORT=y \
            CONFIG_IP_SET_HASH_NETIFACE=y CONFIG_IP_SET_LIST_SET=y \
            CONFIG_IP6_NF_NAT=y CONFIG_IP6_NF_TARGET_MASQUERADE=y; do
            echo "$opt" >> arch/arm64/configs/gki_defconfig
          done

      - name: Add BBR and congestion control algorithms
        if: inputs.bbr_enable != 'false'
        run: |
          cd kernel_source
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> arch/arm64/configs/gki_defconfig
          for opt in \
            CONFIG_TCP_CONG_BBR=y CONFIG_TCP_CONG_CUBIC=y \
            CONFIG_TCP_CONG_VEGAS=y CONFIG_TCP_CONG_NV=y \
            CONFIG_TCP_CONG_WESTWOOD=y CONFIG_TCP_CONG_HTCP=y \
            CONFIG_TCP_CONG_BRUTAL=y; do
            echo "$opt" >> arch/arm64/configs/gki_defconfig
          done
          if [ "${{ github.event.inputs.bbr_enable }}" = "default" ]; then
            echo "CONFIG_DEFAULT_TCP_CONG=bbr" >> arch/arm64/configs/gki_defconfig
          else
            echo "CONFIG_DEFAULT_TCP_CONG=cubic" >> arch/arm64/configs/gki_defconfig
          fi

      - name: Add ADIOS IO scheduler
        if: inputs.adios_enable
        run: |
          cd kernel_source
          echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> arch/arm64/configs/gki_defconfig

      - name: Add Re-Kernel support
        if: inputs.rekernel_enable
        run: |
          echo "CONFIG_REKERNEL=y" >> arch/arm64/configs/gki_defconfig

      - name: Add Baseband Guard
        if: inputs.baseband_guard
        run: |
          cd kernel_source
          echo "CONFIG_BBG=y" >> arch/arm64/configs/gki_defconfig
          curl -sSL https://github.com/cctv18/Baseband-guard/raw/master/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: Apply 完美风驰调度 patch
        if: inputs.enable_scx
        run: |
          cd kernel_source
          git clone https://github.com/Numbersf/SCHED_PATCH.git -b mt6991
          ls -la SCHED_PATCH/
          cp "SCHED_PATCH/fengchi_${{ env.SCHED_FILE }}.patch" ./
          if [ -f "fengchi_${{ env.SCHED_FILE }}.patch" ]; then
            dos2unix "fengchi_${{ env.SCHED_FILE }}.patch"
            patch -p1 -F 3 < "fengchi_${{ env.SCHED_FILE }}.patch"
            echo "完美风驰补丁应用完成"
          else
            echo "未匹配到风驰补丁文件"
            exit 1
          fi

      - name: Set kernel version suffix
        run: |
          cd kernel_source
          KERNEL_NAME='android15-8-g29d86c5fc9dd-abogki428889875-4k'
          if [ -n "${{ github.event.inputs.kernel_suffix }}" ]; then
            for f in scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${{ github.event.inputs.kernel_suffix }}\"|" "$f"
            done
          else
            for f in scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${KERNEL_NAME}\"|" "$f"
            done
            sed -i "s/-4k/-${KERNEL_NAME}/g" arch/arm64/configs/gki_defconfig
          fi
          sed -i 's/${scm_version}//' scripts/setlocalversion
          echo "CONFIG_LOCALVERSION_AUTO=n" >> arch/arm64/configs/gki_defconfig

      - name: Build kernel with Bazel/Kleaf
        run: |
          cd kernel_source
          export CCACHE_DIR=${{ env.CCACHE_DIR }}
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          bazel build //:kernel_aarch64_dist --config=fast --config=stamp
          ccache -s

      - name: Save ccache
        if: inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ace5u-${{ github.event.inputs.ksu_type }}-${{ runner.os }}-${{ github.ref_name }}

      - name: Extract kernel artifacts from Bazel output
        run: |
          cd kernel_source
          DIST_DIR=""
          for d in bazel-bin/kernel_aarch64_dist dist out/*/dist; do
            [ -d "$d" ] && DIST_DIR="$d" && break
          done
          if [ -z "$DIST_DIR" ]; then
            DIST_DIR=$(find bazel-bin -name "kernel_aarch64_dist" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$DIST_DIR" ]; then
            DIST_DIR=$(find bazel-bin -type d -name "dist" 2>/dev/null | head -1)
          fi
          echo "Dist dir: $DIST_DIR"
          [ -n "$DIST_DIR" ] && ls -la "$DIST_DIR/"
          IMAGE=$(find "${DIST_DIR:-bazel-bin}" -name "Image" -type f ! -name "*.lz4" ! -name "*.gz" 2>/dev/null | head -1)
          if [ -z "$IMAGE" ]; then
            IMAGE=$(find bazel-bin -name "Image" -type f ! -name "*.lz4" ! -name "*.gz" 2>/dev/null | head -1)
          fi
          if [ -z "$IMAGE" ]; then
            echo "Error: Kernel Image not found!"
            find bazel-bin -name "Image*" -type f 2>/dev/null | head -10
            exit 1
          fi
          echo "Found Image at: $IMAGE"
          mkdir -p out/arch/arm64/boot
          cp "$IMAGE" out/arch/arm64/boot/Image

      - name: Apply KPM patch to kernel image
        run: |
          if [ "${{ github.event.inputs.kpm_enable }}" = "builtin" ] && [[ "${{ github.event.inputs.ksu_type }}" =~ ^(sukisu|resukisu)$ ]]; then
            cd kernel_source/out/arch/arm64/boot
            curl -LO https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/latest/download/patch_linux
            chmod +x patch_linux
            ./patch_linux
            mv oImage Image
          elif [ "${{ github.event.inputs.kpm_enable }}" = "kpn" ]; then
            cd kernel_source/out/arch/arm64/boot
            wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux
            wget https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux
            chmod +x kptools-linux
            ./kptools-linux -p -i Image -k kpimg-linux -o oImage
            mv oImage Image
          fi

      - name: Clone AnyKernel3 and package
        id: create_zip
        run: |
          cd kernel_source
          git clone https://github.com/cctv18/AnyKernel3 --depth=1
          rm -rf AnyKernel3/.git
          cd AnyKernel3
          cp ../out/arch/arm64/boot/Image ./Image
          if [ ! -f Image ]; then
            echo "Error: Image file missing!"
            exit 1
          fi
          case "${{ github.event.inputs.ksu_type }}" in
            sukisu)   KTN="SukiSU" ;;
            resukisu) KTN="ReSukiSU" ;;
            ksunext)  KTN="KSUNext" ;;
            ksu)      KTN="KSU" ;;
            *)        KTN="none" ;;
          esac
          if [ "${{ github.event.inputs.lz4kd_enable }}" = "true" ]; then
            wget https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/${{ github.ref_name }}/zram.zip
          fi
          if [ "${{ github.event.inputs.kpm_enable }}" = "kpn" ]; then
            wget https://github.com/cctv18/KPatch-Next/releases/latest/download/kpn.zip
          fi
          KERNEL_NAME='android15-8-g29d86c5fc9dd-abogki428889875-4k'
          if [ -n "${{ github.event.inputs.kernel_suffix }}" ]; then
            AK3_NAME="AnyKernel3_${KTN}_${{ env.KSUVER }}_6.6_${{ github.event.inputs.kernel_suffix }}.zip"
          else
            AK3_NAME="AnyKernel3_${KTN}_${{ env.KSUVER }}_6.6_${KERNEL_NAME}.zip"
          fi
          zip -r ../$AK3_NAME ./*
          echo "ak3name=$AK3_NAME" >> $GITHUB_OUTPUT
          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          {
            echo "Author: $GITHUB_ACTOR"
            echo "Repo: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Time: $TIME_NOW"
            echo "KSU Ver: ${{ env.KSUVER }}"
            echo "KSU Type: ${KTN}"
            echo "susfs: ${{ github.event.inputs.susfs_enable }}"
            echo "KPM: ${{ github.event.inputs.kpm_enable }}"
            echo "LZ4: ${{ github.event.inputs.lz4_enable }}"
            echo "LZ4KD: ${{ github.event.inputs.lz4kd_enable }}"
            echo "IPset: ${{ github.event.inputs.better_net }}"
            echo "BBR: ${{ github.event.inputs.bbr_enable }}"
            echo "ADIOS: ${{ github.event.inputs.adios_enable }}"
            echo "Re-Kernel: ${{ github.event.inputs.rekernel_enable }}"
            echo "BBG: ${{ github.event.inputs.baseband_guard }}"
          } > ak3.log
          zip -z ../$AK3_NAME < ak3.log

      - name: Upload AnyKernel3 artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/kernel_source/AnyKernel*.zip
          archive: false

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: ./release_zips
          skip-decompress: true

      - name: Set release variables
        run: |
          KERNEL_NAME='android15-8-g29d86c5fc9dd-abogki428889875-4k'
          if [ -n "${{ github.event.inputs.kernel_suffix }}" ]; then
            echo "FULL_VERSION=6.6.${{ github.event.inputs.kernel_suffix }}" >> $GITHUB_ENV
          else
            echo "FULL_VERSION=6.6-${KERNEL_NAME}" >> $GITHUB_ENV
          fi
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV
          echo "TAG_HEAD=OPPO-OPlus-Realme-build" >> $GITHUB_ENV
          case "${{ github.event.inputs.ksu_type }}" in
            sukisu)   echo "KSU_TYPENAME=SukiSU Ultra" >> $GITHUB_ENV ;;
            resukisu) echo "KSU_TYPENAME=ReSukiSU" >> $GITHUB_ENV ;;
            ksunext)  echo "KSU_TYPENAME=KernelSU Next" >> $GITHUB_ENV ;;
            ksu)      echo "KSU_TYPENAME=KSU" >> $GITHUB_ENV ;;
            *)        echo "KSU_TYPENAME=无内置KSU" >> $GITHUB_ENV ;;
          esac

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release_notes.md << 'EOF'
          ### 欧加真 ${{ env.KSU_TYPENAME }} MT6991 通用内核 | 构建信息
          - 内核版本号: ${{ env.FULL_VERSION }}
          - 编译时间: ${{ env.TIME_FORM }}
          - 机型：欧加真天玑9400+通用 6.6 内核（一加Ace5 Ultra 6.6 官方OKI源码）
          - KSU分支：${{ env.KSU_TYPENAME }}
          - SUSFS支持：${{ github.event.inputs.susfs_enable }}
          - KPM支持 ：${{ github.event.inputs.kpm_enable }}
          - LZ4支持：${{ github.event.inputs.lz4_enable }}
          - LZ4KD支持：${{ github.event.inputs.lz4kd_enable }}
          - 网络功能增强：${{ github.event.inputs.better_net }}
          - BBR/Brutal算法：${{ github.event.inputs.bbr_enable }}
          - ADIOS调度器：${{ github.event.inputs.adios_enable }}
          - Re-Kernel：${{ github.event.inputs.rekernel_enable }}
          - 基带保护：${{ github.event.inputs.baseband_guard }}
          - 构建系统：Bazel/Kleaf
          EOF
          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.TAG_HEAD }}-${{ env.FULL_VERSION }}" \
            --notes-file release_notes.md \
            release_zips/AnyKernel3_*.zip
