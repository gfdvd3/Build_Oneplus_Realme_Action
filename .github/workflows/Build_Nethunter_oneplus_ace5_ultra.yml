          echo "CONFIG_BT_HCIBTUSB_RTL=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_BT_HCIUART=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_BT_HCIUART_H4=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_BT_HCIBCM203X=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_BT_HCIBPA10X=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_BT_HCIBFUSB=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_BT_HCIVHCI=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_RFKILL=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_RFKILL_INPUT=y" >> ./arch/arm64/configs/gki_defconfig
          # NetHunter - Wireless USB
          echo "CONFIG_WLAN_VENDOR_ATH=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_ATH9K_HTC=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CARL9170=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_ATH6KL=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_ATH6KL_USB=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_WLAN_VENDOR_MEDIATEK=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_MT7601U=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_WLAN_VENDOR_RALINK=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_RT2X00=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_RT2500USB=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_RT73USB=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_RT2800USB=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_RT2800USB_RT33XX=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_RT2800USB_RT35XX=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_RT2800USB_RT3573=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_RT2800USB_RT53XX=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_RT2800USB_RT55XX=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_RT2800USB_UNKNOWN=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_WLAN_VENDOR_REALTEK=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_RTL8187=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_RTL_CARDS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_RTL8192CU=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_RTL8XXXU_UNTESTED=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_WLAN_VENDOR_ZYDAS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_ZD1201=y" >> ./arch/arm64/configs/gki_defconfig
