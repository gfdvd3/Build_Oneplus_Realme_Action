          cd kernel_workspace/common
          sed -i "s/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"${{ env.DEFAULT_SUFFIX }}\"/" ./arch/arm64/configs/gki_defconfig
          sed -i 's/${scm_version}//' ./scripts/setlocalversion

      - name: 📥 Start build timer
        run: echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      - name: 📥 Init ccache (初始化缓存+调优)
        run: |
          export CCACHE_DIR=$HOME/.ccache_${{ env.KSU_TYPE }}_${{ env.DEVICES_NAME }}
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=6
          export CCACHE_MAXSIZE=8G
          export CCACHE_SLOPPINESS=file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros
          export CCACHE_DEPEND=1
          export CCACHE_FILECLONE=1
          sudo /usr/sbin/update-ccache-symlinks
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KSU_TYPE }}_${{ env.DEVICES_NAME }}" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_COMPRESSLEVEL=6" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=8G" >> $GITHUB_ENV
          echo "CCACHE_SLOPPINESS=file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> $GITHUB_ENV
          echo "CCACHE_DEPEND=1" >> $GITHUB_ENV
          clang --version

