          echo "CONFIG_MEDIA_SDR_SUPPORT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_MEDIA_USB_SUPPORT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_AIRSPY=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_HACKRF=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_MSI2500=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_DVB_RTL2830=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_DVB_RTL2832=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_DVB_RTL2832_SDR=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_DVB_SI2168=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_DVB_ZD1301_DEMOD=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_MEDIA_SUBDRV_AUTOSELECT=n" >> ./arch/arm64/configs/gki_defconfig
          # NetHunter - USB Gadget (HID, BadUSB, serial)
          echo "CONFIG_USB_GADGET=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_CONFIGFS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_CONFIGFS_SERIAL=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_CONFIGFS_ACM=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_CONFIGFS_OBEX=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_CONFIGFS_NCM=y" >> ./arch/arm64/configs/gki_defconfig
