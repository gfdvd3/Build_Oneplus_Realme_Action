          echo "CONFIG_USB_CONFIGFS_ECM_SUBSET=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_CONFIGFS_RNDIS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_CONFIGFS_EEM=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_CONFIGFS_MASS_STORAGE=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_CONFIGFS_F_FS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_CONFIGFS_F_UVC=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_CONFIGFS_F_MIDI=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_CONFIGFS_F_UAC2=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_ACM=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_SERIAL=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_SERIAL_GENERIC=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_SERIAL_FTDI_SIO=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_SERIAL_CH341=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_SERIAL_CP210X=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_SERIAL_PL2303=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_SERIAL_CONSOLE=y" >> ./arch/arm64/configs/gki_defconfig
          # NetHunter - CAN bus
          echo "CONFIG_CAN=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CAN_RAW=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CAN_BCM=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CAN_GW=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CAN_DEV=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CAN_CALC_BITTIMING=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CAN_LEDS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CAN_VCAN=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CAN_SLCAN=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CAN_HI311X=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CAN_MCP251X=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CAN_EMS_USB=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CAN_ESD_USB=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CAN_GS_USB=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CAN_KVASER_USB=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CAN_PEAK_USB=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CAN_8DEV_USB=y" >> ./arch/arm64/configs/gki_defconfig
          # NetHunter - NFS
          echo "CONFIG_NFS_V2=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NFS_V3=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NFS_V4=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NFSD=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NFSD_V3=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NFSD_V4=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CIFS=y" >> ./arch/arm64/configs/gki_defconfig
          # NetHunter - HID / Input
          echo "CONFIG_HIDRAW=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_UHID=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_HIDDEV=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_INPUT_UINPUT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_INPUT_JOYSTICK=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_JOYSTICK_XPAD=y" >> ./arch/arm64/configs/gki_defconfig
          # NetHunter - USB networking
          echo "CONFIG_USB_USBNET=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_RTL8150=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_RTL8152=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_NET_CDC_EEM=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_NET_CDC_SUBSET=y" >> ./arch/arm64/configs/gki_defconfig
          # NetHunter - Misc
          echo "CONFIG_PPP=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_PPP_BSDCOMP=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_PPP_DEFLATE=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_PPP_MPPE=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_PPTP=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_PPPOL2TP=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_WIREGUARD=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_TUN=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_VETH=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_DUMMY=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_IFB=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_BRIDGE_NETFILTER=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NF_NAT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NF_NAT_FTP=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NF_NAT_TFTP=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NF_NAT_IRC=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_XFRM_USER=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_INET_ESP=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_INET6_ESP=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NET_SCHED=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NET_SCH_FQ_CODEL=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NET_CLS_FLOW=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NET_EMATCH=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NET_CLS_ACT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_DM_CRYPT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_DM_VERITY=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_FUSE_FS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NFC=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_IIO=y" >> ./arch/arm64/configs/gki_defconfig
          echo "NetHunter内核配置添加完成"

      - name: 🔧 Set Kernel name (设置内核名称)
        run: |
          cd kernel_workspace/common
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-nethunter"/' ./arch/arm64/configs/gki_defconfig
          sed -i 's/${scm_version}//' ./scripts/setlocalversion
          sudo sed -i 's/check_defconfig//' ../common/build.config.gki

      - name: 📥 Start build timer
        run: echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      - name: 📥 Init ccache (初始化缓存)
        run: |
          export CCACHE_DIR=$HOME/ccache
          export CCACHE_COMPRESS=1
          export CCACHE_COMPRESSLEVEL=6
          export CCACHE_MAXSIZE=8G
          sudo /usr/sbin/update-ccache-symlinks
          echo "CCACHE_DIR=$HOME/ccache" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_COMPRESSLEVEL=6" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=8G" >> $GITHUB_ENV
          clang --version

      - name: 🔨 Build Kernel (构建内核)
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          which ccache
          ccache --version
          CLANG_DIR="$WORKDIR/kernel_workspace/clang18/bin"
          CLANG_VERSION="$($CLANG_DIR/clang --version | head -n 1)"
          LLD_VERSION="$($CLANG_DIR/ld.lld --version | head -n 1)"
          echo "CLANG: $CLANG_VERSION"
          echo "LLD: $LLD_VERSION"
          cd kernel_workspace/common
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image
          echo "构建完成"

      - name: 🕒 Calculate build time
        run: |
          END=$(date +%s)
          TIME=$((END - BUILD_START))
          echo "BUILD_TIME=$TIME" >> $GITHUB_ENV
          echo "Build time: $TIME seconds"

      - name: 📦 Make AnyKernel3
        run: |
          cp "${GITHUB_WORKSPACE}/.github/workflows/tools/main.bin" ./
          chmod +x main.bin
          ./main.bin "make_anykernel3"
          rm -rf ./main.bin

      - name: 📤 Upload AnyKernel3
        uses: actions/upload-artifact@v5
        with:
          name: AK3_Nethunter_oneplus_ace5_ultra
          path: ./AnyKernel3/*
