name: Build_Nethunter_oneplus_ace5_ultra
permissions:
  contents: read
  actions: write
on:
  workflow_dispatch:

jobs:
  build:
    name: Build_Nethunter_ace5_ultra
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DEVICES_NAME: oneplus_ace5_ultra
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🛠 Install dependencies and sync source (安装环境依赖+初始化源码)
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          sudo apt-mark hold firefox libc-bin
          sudo apt purge man-db
          sudo rm -rf /var/lib/man-db/auto-update
          sudo apt update
          sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev dos2unix p7zip-full zstd ccache
          echo "正在克隆源码仓库..."
          aria2c -s16 -x16 -k1M https://github.com/gfdvd3/android_kernel_oneplus_mt6991/archive/refs/heads/oneplus/mt6991_v_15.0.2_ace5_ultra.zip -o common.zip
          unzip -q common.zip
          mv android_kernel_oneplus_mt6991-* common
          rm -rf common.zip
          echo "正在克隆llvm-clang18工具链..."
          mkdir -p clang18
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip -o clang.zip
          unzip -q clang.zip -d clang18
          rm -rf clang.zip
          echo "正在克隆构建工具..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip -o build-tools.zip
          unzip -q build-tools.zip
          rm -rf build-tools.zip
          wait
          echo "所有源码及LLVM-Clang18工具链初始化完成！"

      - name: 🔧 Apply NetHunter kernel config (应用NetHunter内核配置)
        run: |
          cd kernel_workspace/common
          # NetHunter - General
          echo "CONFIG_SYSVIPC=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_POSIX_MQUEUE=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_IPC_NS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_PID_NS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_DEVTMPFS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_XATTR=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_KALLSYMS_ALL=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_MODULES=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_MODULE_UNLOAD=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_MODULE_FORCE_UNLOAD=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_MODVERSIONS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_SWAP=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_CGROUPS=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_MEMCG=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_BLK_CGROUP=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NAMESPACES=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_EXPERT=y" >> ./arch/arm64/configs/gki_defconfig
          # NetHunter - Network / BT
          echo "CONFIG_NETFILTER=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_TARGET_CONNMARK=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_TARGET_MARK=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_CONNMARK=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_STATE=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_MAC=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_IPRANGE=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_LIMIT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET=y" >> ./arch/arm64/configs/gki_defconfig
          echo "CONFIG_IP_SET_HASH_IP=y" >> ./arch/arm64/configs/gki_defconfig
